appId: com.gallerymirror.desktop
# ⚠️ 产品名 2026-09-25 由 GalleryMirror 改为 Neko_Spark（用户要求）。
#   productName 决定：exe 文件名（Neko_Spark.exe）、安装包文件名、开始菜单/桌面快捷方式名字。
#   appId 故意**保持不动**：它是"应用身份"，改了会让 Windows 把它当成另一个程序
#   （旧的卸载项会残留成孤儿）。
productName: Neko_Spark
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# ⚠️ 素材必须随安装包一起发布（2026-09-27 补）。
#   files 只打 out/**，而空状态大插画和贴图是**运行时从数据目录读**的
#   （GET /api/v1/background/:n、GET /api/v1/stickers），不在 out/ 里 ——
#   所以发行版装到新机器上，数据目录是空的，插画和贴图就全没了
#   （开发机上看得到，只是因为开发机的数据目录里恰好有这些图）。
#   打包进 resources/assets/，启动时由 seedBundledAssets() 补进数据目录。
#   from 相对 desktop/（electron-builder 的工作目录）。
extraResources:
  - from: ../GalleryMirrorData/background-1.webp
    to: assets/background-1.webp
  - from: ../GalleryMirrorData/background-2.webp
    to: assets/background-2.webp
  - from: ../GalleryMirrorData/background-3.webp
    to: assets/background-3.webp
  - from: ../GalleryMirrorData/background-4.webp
    to: assets/background-4.webp
  - from: ../GalleryMirrorData/stickers
    to: assets/stickers
  # 素材原图（prepare-stickers.mjs 的输入，界面不直接读）；一起带上便于二次加工
  - from: ../GalleryMirrorData/nekoha-originals
    to: assets/nekoha-originals
win:
  # 图标 = 侧栏那个猫猫头（assets/stickers/logo.png）；
  # build/icon.ico 由 `.cache/make-icon.mjs` 生成（7 个尺寸：16~256）。
  # 不配它的话 Windows 会显示 Electron 默认图标（深色圆 + 轨道符号，用户嫌丑）。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  # 卸载/覆盖安装不删除用户级 Electron 配置；相册仓库本身也位于安装目录之外。
  deleteAppDataOnUninstall: false
  # ⚠️ perMachine: true = "为使用这台电脑的任何人安装"，也就是**所有用户**安装：
  #   ① 安装时不再出现"为哪位用户安装"那个选择页面（跟普通软件一样，用户要的就是这个）
  #      —— 之前是 false + allowElevation，等于"两种模式都支持"，覆盖安装时必弹那个页面，
  #      连 `/S` 都拦不住，用户以为在让他手动安装。
  #   ② 代价是装的时候要管理员权限：双击安装包会弹一次 UAC（正常软件都这样），
  #      装到 D:\GalleryMirror（build/installer.nsh 里钉死的默认目录，铁律 2：不放 C 盘）。
  #   ③ 所以**日常"改完自己装上"不要走安装器**（UAC 会卡住自动化），走
  #      `node scripts/deploy-installed.mjs`：它直接把 release/win-unpacked 里的成品复制到
  #      D:\GalleryMirror（关程序 → 复制 → 重启 → 验证），全程没有任何窗口、不需要点任何东西。
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Neko_Spark
  include: build/installer.nsh
  artifactName: ${productName}-${version}-安装版.${ext}
portable:
  artifactName: ${productName}-${version}-便携版.${ext}
